# SPARQL endpoint to use for queries.
# "fuseki" = start a local Fuseki server automatically (requires: brew install fuseki).
# Any URL = query that endpoint directly (e.g. a remote SPARQL endpoint).
sparql_url: fuseki

# Number of parallel workers for mclapply-based targets (nli_ready_parquet).
# Falls back to 1 on Windows (mclapply does not fork there).
workers: 8

assessments:
  - id: GA1
    ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/main/Global%20Assessment%201/GA1_v09.ttl
    full_text: false
  - id: VA
    ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Values%20Assessment/VA_v05.ttl
    full_text: false
  - id: TCA
    ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Transformative%20Change%20Assessment/TCA_v02.ttl
    full_text: false
  - id: IAS
    ttl_url: https://raw.githubusercontent.com/IPBES-Data/IPBES_LOD/refs/heads/main/Invasive%20Alien%20Species%20Assessment/IAS_v05.ttl
    full_text: true

# NLI alignment backend. The pipeline POSTs (premise, hypothesis) pairs to a
# zero-shot NLI server (see external/runpod/docker/nli-runpod/). Switch models by changing
# `active` to a key under `configs`. Use `~` to disable.
#
# bge_m3_zeroshot is now the sole production config -- deberta_zeroshot/
# deberta_zeroshot_v3 are RETIRED, not just
# dormant. Switched over because, once actually measured on real GPU pods
# (not the emulated-CPU numbers first assumed), bge-m3-zeroshot-v2.0-c came
# out strictly ahead for this project's use case: ~2.7x faster per pod than
# deberta-v3-large-zeroshot-v2.0 on an identical 256-premise batch (33.6 vs
# 12.5 pairs/sec -- DeBERTa's disentangled-attention mechanism is heavier
# per token despite fewer params), genuinely multilingual (citing-paper
# premises can be in any language; deberta-v3-large-zeroshot-v2.0 is
# English-only), and a ~8194-token ceiling vs. deberta's hard 512. A n=350
# spot-check (150 pairs deberta had called REFUTES-certain + 200 general
# random pairs, scored live against the real bge-m3 pod) found its overall
# confidence distribution closely matches deberta's own full-corpus shape
# (median ~0.50 vs ~0.51; both flag ~71-75% of pairs "uncertain" at 0.60) --
# not a rigorous calibration, but enough to not fly blind. See
# TD_BM_NLI_approach.qmd for the full writeup. All prior deberta-scored
# output (output/nli_scores_evidence/, output/llm_verification/) has since
# been deleted (disk space) and was not migrated -- there is nothing left to
# reconcile against, which is what made a clean full switch straightforward.
#
# granularity: how a BM's bm_description/bm_label text is cut into claims --
#   "naive_bm" (default) -- evidence-delimited sub-claims (segment_bm_by_evidence(),
#     2-17 per BM). Currently active (bge_m3_zeroshot.granularity below);
#     output partitioned under output/nli_ready_evidence/granularity=naive_bm/
#     and output/nli_scores_evidence/granularity=naive_bm/.
#   "complete_bm" -- each field taken whole, un-segmented (segment_bm_whole()):
#     2 claims per BM (bm_description + bm_label), or 1 if the two fields are
#     identical after whitespace normalization. Measured ~71% fewer NLI pairs
#     combined across GA1+IAS (3,582,329 -> ~1,049,572) -- see
#     TD_BM_NLI_approach.qmd for the full table and an important caveat: a
#     complete-BM claim can exceed a model's own max_position_embeddings (512
#     for deberta-v3-large-zeroshot-v2.0 -- a real architectural limit, not a
#     raisable config value), truncating the CLAIM itself, not just the
#     premise -- not a concern for bge_m3_zeroshot's own ~8194-token ceiling.
#     Output partitioned under .../granularity=complete_bm/.
nli:
  # granularity: atomic_bm's LLM-completion step (R/build_claim_completion.R):
  # resolves elliptical fragments from segment_bm_atomic()'s per-brace split
  # into self-contained claims. Tiny volume -- 656 real fragments actually
  # need a call (computed directly against all 88 BMs across both
  # assessments; single-fragment BM fields skip the LLM entirely), so this
  # is picked for completion quality/instruction-following on a strict
  # "never invent new content, only restore grammar" rewriting task, not
  # cost -- every real candidate model priced out under $1 total for the
  # whole one-time job. claude-haiku-4.5 chosen for its strong track record
  # on precise, constrained rewriting instructions; not empirically
  # A/B-tested against alternatives the way gpt-oss-20b was for Phase 2
  # verification earlier -- swap `active` below if that's ever done.
  claim_completion:
    active: haiku_completion   # which entry under configs: is active

    configs:
      haiku_completion:
        model: "anthropic/claude-haiku-4.5"


  active: bge_m3_zeroshot_atomic_bm   # which entry under configs: is active -- the only config with running pods

  configs:
    # ACTIVE -- the sole production NLI config (see the comment above nli:
    # for the full rationale: faster per-pod than deberta_zeroshot once
    # actually measured, genuinely multilingual, and a ~8194-token ceiling).
    # Originally added for granularity: complete_bm's long-context need
    # specifically -- premises (citing-paper title+abstract) can be in any
    # language the source paper was published in, even though the
    # hypothesis (BM claim) is always English, so this needs cross-lingual
    # entailment, not just a longer-context English model -- but that
    # cross-lingual need applies regardless of granularity, which is why
    # this config now also covers naive_bm (see granularity: below).
    # Image: ghcr.io/rkrug/nli-runpod-bge-m3:v0.1.0 (see TD_BM_NLI_approach.qmd).
    bge_m3_zeroshot_complete_bm:
      scheme: https
      host: ["orn81igh4swblu-8080.proxy.runpod.net", "x4iv6cr25xoown-8080.proxy.runpod.net", "55o5uwkw0ipgav-8080.proxy.runpod.net"]
      port: null
      auth_token_keyring: null
      model: MoritzLaurer/bge-m3-zeroshot-v2.0-c   # label only; verified against /health. max_position_embeddings ~8194 (real limit, not this project's choice)
      candidate_labels: ["supports", "refutes", "is not relevant to"]
      hypothesis_template: "This paper {} the following claim: %s"
      passes: 3   # zero-shot: 3 forward passes per claim, one per reformulated candidate label, cross-normalized (see nli-runpod/server.py); a directly fine-tuned classifier instead uses passes: 1 (one forward pass, native head softmax) -- see the commented deberta_finetuned template below
      batch_size: 64          # measured: 33.6 pairs/sec on one L4 pod at this setting (256-premise real batch) -- ~2.7x deberta_zeroshot's 12.5 pairs/sec at batch_size 128 on the same batch
      max_length: 2048        # comfortably covers complete_bm's largest measured claim (~885 tokens) + a full premise, well under the ~8194 ceiling
      uncertain_threshold: 0.60   # spot-checked (n=350: 150 deberta REFUTES-certain pairs + 200 general random, scored live) -- overall confidence shape closely matches deberta_zeroshot's own full-corpus distribution (median ~0.50 vs ~0.51), so left unchanged; not a rigorous calibration, see TD_BM_NLI_approach.qmd
      nei_threshold: 0.90
      granularity: complete_bm    #  naive_bm also supported/tested (see comment above nli:); naive_bm is the current default corpus
      train: false   # fine-tune this config's model (scripts/training/train_nli.py, via the nli_finetuned_model target) -- real local CPU time (~25min for GA1-only data), opt-in, default false. See nli_finetuned_model/R/build_nli_finetuned_model.R.
      downsample_seed: null   # null (default) = train on the full pooled dataset as-is. A seed (e.g. 42) downsamples every label class down to the smallest class's count before training, for class balance -- real risk once multiple assessments are pooled and one (e.g. a keypaper-only assessment) contributes far more SUPPORTS/NOT_ENOUGH_INFO than REFUTES. See scripts/training/train_nli.py.

    bge_m3_zeroshot_atomic_bm:
      scheme: https
      host: ["qlokuriufunkk3-8080.proxy.runpod.net", "qlokuriufunkk3-8080.proxy.runpod.net", "cqa0a62sszktfh-8080.proxy.runpod.net", "0v7ju37n9yld2e-8080.proxy.runpod.net", "0zdde0l5ykaeka-8080.proxy.runpod.net", "wfdrj1kmd7dkt2-8080.proxy.runpod.net"]
      # kuhykgssi61j0v-8080.proxy.runpod.net dropped for now -- confirmed
      # unreachable (HTTP 404 on /health, not just a boot-time delay) while
      # the other 5 were healthy. Add it back once its pod is confirmed up.
      auth_token_keyring: null
      model: MoritzLaurer/bge-m3-zeroshot-v2.0-c   # label only; verified against /health. max_position_embeddings ~8194 (real limit, not this project's choice)
      candidate_labels: ["supports", "refutes", "is not relevant to"]
      hypothesis_template: "This paper {} the following claim: %s"
      passes: 3   # zero-shot: 3 forward passes per claim, one per reformulated candidate label, cross-normalized -- see bge_m3_zeroshot_complete_bm's own passes: comment above
      batch_size: 64          # measured: 33.6 pairs/sec on one L4 pod at this setting (256-premise real batch) -- ~2.7x deberta_zeroshot's 12.5 pairs/sec at batch_size 128 on the same batch
      max_length: 2048        # comfortably covers complete_bm's largest measured claim (~885 tokens) + a full premise, well under the ~8194 ceiling
      uncertain_threshold: 0.60   # spot-checked (n=350: 150 deberta REFUTES-certain pairs + 200 general random, scored live) -- overall confidence shape closely matches deberta_zeroshot's own full-corpus distribution (median ~0.50 vs ~0.51), so left unchanged; not a rigorous calibration, see TD_BM_NLI_approach.qmd
      nei_threshold: 0.90
      granularity: atomic_bm    #  naive_bm also supported/tested (see comment above nli:); naive_bm is the current default corpus
      train: true   # see bge_m3_zeroshot_complete_bm's own train: comment above
      downsample_seed: 13   # see bge_m3_zeroshot_complete_bm's own downsample_seed: comment above

    bge_m3_zeroshot_naive_bm:
      scheme: https
      host: ["d78ew5xa898onb-8080.proxy.runpod.net", "k3d0ojjo3r34gn-8080.proxy.runpod.net", "imxudxy1q07w93-8080.proxy.runpod.net", "2yjh0c3crclwg2-8080.proxy.runpod.net", "qzv2pwdj8gccmj-8080.proxy.runpod.net", "6dbdypmy7ttlqe-8080.proxy.runpod.net", "tkmmt2u8s8xoy0-8080.proxy.runpod.net"]
      port: null
      auth_token_keyring: null
      model: MoritzLaurer/bge-m3-zeroshot-v2.0-c   # label only; verified against /health. max_position_embeddings ~8194 (real limit, not this project's choice)
      candidate_labels: ["supports", "refutes", "is not relevant to"]
      hypothesis_template: "This paper {} the following claim: %s"
      passes: 3   # zero-shot: 3 forward passes per claim, one per reformulated candidate label, cross-normalized -- see bge_m3_zeroshot_complete_bm's own passes: comment above
      batch_size: 64          # measured: 33.6 pairs/sec on one L4 pod at this setting (256-premise real batch) -- ~2.7x deberta_zeroshot's 12.5 pairs/sec at batch_size 128 on the same batch
      max_length: 2048        # comfortably covers complete_bm's largest measured claim (~885 tokens) + a full premise, well under the ~8194 ceiling
      uncertain_threshold: 0.60   # spot-checked (n=350: 150 deberta REFUTES-certain pairs + 200 general random, scored live) -- overall confidence shape closely matches deberta_zeroshot's own full-corpus distribution (median ~0.50 vs ~0.51), so left unchanged; not a rigorous calibration, see TD_BM_NLI_approach.qmd
      nei_threshold: 0.90
      granularity:  naive_bm   # complete_bm also supported/tested (see comment above nli:); naive_bm is the current default corpus
      train: false   # see bge_m3_zeroshot_complete_bm's own train: comment above
      downsample_seed: null   # see bge_m3_zeroshot_complete_bm's own downsample_seed: comment above

    # nli_finetuned: a directly fine-tuned 3-way classifier (scripts/training/
    # train_nli.py), NOT a zero-shot model -- passes: 1 tells score_one_claim.R
    # and nli-runpod/server.py to skip the candidate-label reformulation
    # scheme entirely: one forward pass per (premise, raw claim text) pair,
    # reading the model's own native 3-way softmax directly, instead of 3
    # passes over reformulated "This paper {supports/refutes/is not relevant
    # to} the claim" hypotheses. candidate_labels here MUST equal the
    # fine-tuned model's own id2label values (server.py's _direct_label_order()
    # matches by name, not position, and fails loudly on a mismatch) -- hence
    # SUPPORTS/REFUTES/NOT_ENOUGH_INFO here, not the lowercase short phrases
    # the zero-shot configs above use. hypothesis_template is unused in this
    # mode (no per-label reformulation happens) and is omitted.
    # nli_finetuned:
    #   scheme: https
    #   host: <pod-id>-8080.proxy.runpod.net   # fill in after the pod boots
    #   port: null
    #   auth_token_keyring: null
    #   model: /app/nli-ipbes-finetuned/best   # baked into the Docker image
    #   candidate_labels: ["SUPPORTS", "REFUTES", "NOT_ENOUGH_INFO"]
    #   passes: 1
    #   batch_size: 32
    #   uncertain_threshold: 0.60
    #   nei_threshold: 0.90

# Phase 2 — LLM verification of NLI-flagged pairs (see TD_NLI_LLM_two_phase.qmd
# and R/build_llm_verification_parquet.R). One ellmer::chat_openrouter() call
# per (claim, work) pair via OpenRouter. Switch models by changing `active` to
# a key under `configs`, same pattern as `nli.active` above.
#
# max_active and max_tokens are carried over unchanged from the sibling
# Categorisation_Literature project's proven epistemology-classifier configs
# (input/config.yaml's `epistemology:` block there), not re-derived from this
# schema's smaller field count:
#   - max_active: 24 concurrent OpenRouter requests was the value actually run
#     at ~2,800-call scale there without hitting rate limits.
#   - max_tokens: 8000 is a cap, not a reservation -- unused tokens are not
#     billed. It matters on REASONING models (gpt-5, gemini-2.5-pro): thinking
#     tokens are billed against the same budget as the visible JSON, and
#     leaving it too low there truncated responses mid-JSON in the sibling
#     project even though this schema's own visible output (four short
#     scalar fields) needs far less than 8000 on a non-reasoning model like
#     gpt-4o-mini. Lower it per-config if measured usage justifies it; there
#     is no cost pressure to do so pre-emptively.
#
# nli_labels: which NLI label(s) this config routes -- null/omitted (any
#   label, no filter) or one/more labels, e.g. [REFUTES], [REFUTES, SUPPORTS].
# nli_certainty: which confidence band(s) -- null/omitted (any), or one/more
#   of "certain" (uncertain == FALSE) / "uncertain" (uncertain == TRUE), e.g.
#   certain, or [certain, uncertain] (equivalent to null, spelled out).
# Combined with AND: nli_labels: [REFUTES, SUPPORTS], nli_certainty: certain
# routes every high-confidence REFUTES or SUPPORTS pair (measured: 26,861
# REFUTES-certain + 52,061 SUPPORTS-certain = 78,922 of 3,547,231 scored
# pairs, ~$11.75 combined at gpt-4o-mini rates) -- REFUTES-certain alone was
# the original first step; SUPPORTS-certain was added once the REFUTES
# funnel report (IPBES_Label_Funnel_Report.qmd) was generalized to cover
# both labels. Broader sets (either label at any confidence, or adding
# NOT_ENOUGH_INFO when uncertain: 2,357,718 pairs for the original
# REFUTES-only design) are left for later by widening either field or
# defining additional configs. Output is hive-partitioned by
# nli_route=<LABEL>-<certainty> too -- but that value is derived PER ROW
# from its own actual label/uncertain outcome, not from these filter
# fields, so a config listing several labels or certainties still splits
# its output across one partition per outcome actually present (e.g.
# nli_labels: [REFUTES, SUPPORTS] produces nli_route=REFUTES-certain AND
# nli_route=SUPPORTS-certain as separate partitions, not one merged one).
#
# Every config reviews ALL citing works found under the claim's BM -- there
# is no candidate-narrowing lever anymore (retired: real measured reduction
# was only ~14% for GA1 atomic_bm, not worth the matching/drift-check
# machinery it cost to maintain). Instead, each scored row is TAGGED with
# `direct_evidence_match` -- TRUE if that citing work traces back, via the
# snowball citation graph, to a seed reference whose refs_parquet `sm`
# matches THIS claim's own evidence-reference sub-chapter(s) (e.g. {5.4.1}),
# FALSE otherwise (including every row when the claim has no evidence braces
# at all, or under `complete_bm`, whose whole-field claims carry no
# per-sub-claim evidence tokens to match against in the first place). See
# R/build_llm_candidate_scope_parquet.R (the matching computation, unchanged
# from when it fed a filter) and R/build_llm_verification_parquet.R (where
# the tag is now attached) for the full design.
llm_verification:
  active: openrouter_cheap   # which entry under configs: is active

  configs:
    # Default: cheap, fast, non-reasoning. First step: high-confidence
    # REFUTES/SUPPORTS.
    openrouter_cheap:
      model: "openai/gpt-4o-mini"
      temperature: 0
      max_tokens: 8000
      max_active: 24
      max_retries: 2
      nli_labels: [REFUTES, SUPPORTS]
      nli_certainty: certain

    # Step up when the cheap model is topic-matching rather than actually
    # judging the claim (spot-check the `quote`/`explanation` columns).
    openrouter_midtier:
      model: "google/gemini-2.5-flash"
      temperature: 0
      max_tokens: 8000
      max_active: 24
      max_retries: 2
      nli_labels: [REFUTES, SUPPORTS]
      nli_certainty: certain

    # For a final, citable verification pass. Reasoning model -- see the
    # max_tokens note above for why it still needs the full 8000 despite the
    # small visible schema.
    openrouter_toptier_gpt5:
      model: "openai/gpt-5"
      temperature: 0
      max_tokens: 8000
      max_active: 24
      max_retries: 2
      nli_labels: [REFUTES, SUPPORTS]
      nli_certainty: certain
